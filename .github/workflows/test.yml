name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Keep the supported Python minor versions on a stable hosted runner.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pyyaml

      - name: Full core suite with coverage
        if: matrix.python-version == '3.10'
        run: >-
          python -m pytest tests/ -q -o addopts= --tb=short
          --cov=paydirt --cov-report=term-missing --cov-report=xml --durations=30

      - name: Python compatibility checks
        if: matrix.python-version != '3.10'
        run: >-
          python -m pytest -q -o addopts= --tb=short
          tests/test_game.py tests/test_save_game.py tests/test_season_rules.py
          tests/test_team_charts.py tests/test_cli.py

      - name: Upload coverage reports
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check paydirt/ tests/ paydirt-web/backend/

  browser-games:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: paydirt-web/frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: paydirt-web/frontend/package-lock.json
      - name: Install backend dependencies
        run: python3 -m pip install -r ../backend/requirements.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Frontend unit regressions and coverage
        run: npm run test:coverage -- --run
      - name: Build frontend
        run: npm run build
      - name: Play complete games through the UI
        run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-game-failures
          path: paydirt-web/frontend/test-results/
          retention-days: 7

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: paydirt-web/backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install backend and test dependencies
        run: python -m pip install -r requirements.txt pytest "httpx<0.28"
      - name: Run backend regressions
        run: python -m pytest tests/ -q -o addopts= --tb=short

  public-ai-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install pytest pyyaml
      - name: Audit complete public season and balanced comparison
        run: python tests/run_ai_audit.py --season 2026 --weeks 16 --seed 8306 --compare-balanced --output .ai-audits/public-season.json

  chart-quality:
    # Public committed-chart checks only; private source reproduction stays local.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: '1977'
            season: 1977
            teams: 28
          - directory: '1983'
            season: 1983
            teams: 28
          - directory: '2024'
            season: 2024
            teams: 32
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install public chart check dependencies
        run: python -m pip install pytest pyyaml
      - name: Verify public chart validation regressions
        run: python -m pytest tests/test_public_chart_audit.py tests/test_chart_audit.py tests/test_chart_loader.py -q -o addopts= --tb=short
      - name: Validate every committed chart and engine decoder
        run: >-
          python scripts/audit_public_charts.py
          --season-dir seasons/${{ matrix.directory }}
          --expected-teams ${{ matrix.teams }}
          --output .ai-audits/public-chart-quality-${{ matrix.season }}.json
      - name: Preserve public chart validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: public-chart-quality-${{ matrix.season }}
          path: .ai-audits/public-chart-quality-${{ matrix.season }}.json
