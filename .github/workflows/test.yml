name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    # Keep the supported Python minor versions on a stable hosted runner.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pyyaml

      - name: Run tests
        run: |
          pytest --tb=short -v

      - name: Run tests with coverage
        if: matrix.python-version == '3.10'
        run: |
          pytest --cov=paydirt --cov-report=term-missing --cov-report=xml

      - name: Upload coverage reports
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check paydirt/ tests/ paydirt-web/backend/

  browser-games:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: paydirt-web/frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: paydirt-web/frontend/package-lock.json
      - name: Install backend dependencies
        run: python3 -m pip install -r ../backend/requirements.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Frontend unit regressions and coverage
        run: npm run test:coverage -- --run
      - name: Build frontend
        run: npm run build
      - name: Play complete games through the UI
        run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-game-failures
          path: paydirt-web/frontend/test-results/
          retention-days: 7

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: paydirt-web/backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install backend and test dependencies
        run: python -m pip install -r requirements.txt pytest "httpx<0.28"
      - name: Run backend regressions
        run: python -m pytest tests/ -q -o addopts= --tb=short

  public-ai-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install pytest pyyaml
      - name: Audit complete public season and balanced comparison
        run: python tests/run_ai_audit.py --season 2026 --weeks 16 --seed 8306 --compare-balanced --output .ai-audits/public-season.json

  chart-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: 1983-generated
            season: 1983
            source_url_var: CHART_SOURCES_1983_URL
            source_sha_var: CHART_SOURCES_1983_SHA256
          - directory: '2024'
            season: 2024
            source_url_var: CHART_SOURCES_2024_URL
            source_sha_var: CHART_SOURCES_2024_SHA256
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install chart audit dependencies
        run: python -m pip install pyyaml
      - name: Stage approved pinned chart sources
        env:
          SOURCE_URL: ${{ vars[matrix.source_url_var] }}
          SOURCE_SHA256: ${{ vars[matrix.source_sha_var] }}
        run: |
          if [ -z "$SOURCE_URL" ] || [ -z "$SOURCE_SHA256" ]; then
            echo "Approved chart source URL and SHA-256 repository variables are required" >&2
            exit 1
          fi
          mkdir -p .ai-audits/chart-sources/${{ matrix.season }}
          curl --fail --location --proto '=https' --proto-redir '=https' --url "$SOURCE_URL" --output .ai-audits/chart-sources/${{ matrix.season }}/source.tar.gz
          python scripts/stage_chart_sources.py --archive .ai-audits/chart-sources/${{ matrix.season }}/source.tar.gz --sha256 "$SOURCE_SHA256" --destination .ai-audits/chart-sources/${{ matrix.season }}/bundle > .ai-audits/chart-sources/${{ matrix.season }}/stage.json
      - name: Independently regenerate approved chart sources
        run: >-
          python scripts/prepare_chart_sources.py
          --bundle .ai-audits/chart-sources/${{ matrix.season }}/bundle
          --candidate-dir seasons/${{ matrix.directory }}
          --reproduced-dir .ai-audits/chart-sources/${{ matrix.season }}/${{ matrix.season }}-reproduced
          --output .ai-audits/chart-sources/${{ matrix.season }}/source.json
      - name: Reject inaccurate generated chart behavior
        run: >-
          python scripts/audit_generated_charts.py
          --season-dir seasons/${{ matrix.directory }}
          --contract config/chart-validation/${{ matrix.season }}.json
          --output .ai-audits/chart-quality-${{ matrix.season }}.json
          --repetitions 64 --workers 2
      - name: Preserve chart audit evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: chart-quality-${{ matrix.season }}
          path: |
            .ai-audits/chart-quality-${{ matrix.season }}.json
            .ai-audits/chart-sources/${{ matrix.season }}/stage.json
            .ai-audits/chart-sources/${{ matrix.season }}/source.json
