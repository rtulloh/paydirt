name: Build and Release Standalone Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable version tag to build
        required: true
        type: string
      qualification_workflow:
        description: Exact-commit qualification (hotfix only for an explicitly authorized urgent repair)
        required: true
        type: choice
        default: test.yml
        options:
          - test.yml
          - hotfix.yml

permissions:
  contents: read

jobs:
  verify-ci:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      - name: Require successful Tests workflow on the exact tagged commit
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          QUALIFICATION_WORKFLOW: ${{ inputs.qualification_workflow || 'test.yml' }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?", tag):
              raise SystemExit("A version tag is required")
          base = os.environ["GH_API_URL"] + "/repos/" + os.environ["GH_REPO"]
          def get(path):
              request = urllib.request.Request(base + path, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          obj = get("/git/ref/tags/" + urllib.parse.quote(tag, safe=""))["object"]
          for _ in range(10):
              if obj["type"] != "tag":
                  break
              obj = get("/git/tags/" + obj["sha"])["object"]
          sha = obj["sha"]
          if obj["type"] != "commit" or not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Tag does not resolve to a commit")
          qualification = os.environ.get("QUALIFICATION_WORKFLOW", "test.yml")
          if qualification not in {"test.yml", "hotfix.yml"}:
              raise SystemExit("Unsupported qualification workflow")
          hotfix = qualification == "hotfix.yml"
          if hotfix and os.environ.get("RELEASE_EVENT_NAME") != "workflow_dispatch":
              raise SystemExit("Hotfix qualification requires explicit manual release dispatch")
          runs = get("/actions/workflows/" + qualification + "/runs?head_sha=" + sha + "&status=completed&per_page=100")["workflow_runs"]
          approved = [run for run in runs if run.get("head_sha") == sha
                      and run.get("status") == "completed"
                      and run.get("conclusion") == "success"
                      and run.get("path") == ".github/workflows/" + qualification
                      and (not hotfix or run.get("event") == "workflow_dispatch")]
          if not approved:
              raise SystemExit("No successful completed qualification workflow for exact commit " + sha)
          print("Verified", tag, sha, approved[0]["html_url"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("sha=" + sha + "\ntag=" + tag + "\n")
          PY

  chart-quality:
    needs: [verify-ci]
    # Public committed-chart checks only; private source reproduction stays local.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: '1977'
            season: 1977
            teams: 28
          - directory: '1983'
            season: 1983
            teams: 28
          - directory: '2024'
            season: 2024
            teams: 32
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify-ci.outputs.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install public chart check dependencies
        run: python -m pip install pytest pyyaml
      - name: Verify public chart validation regressions
        run: python -m pytest tests/test_public_chart_audit.py tests/test_chart_audit.py tests/test_chart_loader.py -q -o addopts= --tb=short
      - name: Validate every committed chart and engine decoder
        run: >-
          python scripts/audit_public_charts.py
          --season-dir seasons/${{ matrix.directory }}
          --expected-teams ${{ matrix.teams }}
          --output .ai-audits/public-chart-quality-${{ matrix.season }}.json
      - name: Preserve public chart validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: public-chart-quality-${{ matrix.season }}
          path: .ai-audits/public-chart-quality-${{ matrix.season }}.json

  build:
    needs: [verify-ci, chart-quality]
    env:
      RELEASE_TAG: ${{ needs.verify-ci.outputs.tag }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
            platform: linux
            arch: x86_64
          - os: windows-latest
            artifact: windows
            platform: windows
            arch: x86_64
          - os: macos-latest
            artifact: macos-arm64
            platform: macos
            arch: arm64
          - os: macos-26-intel
            artifact: macos-intel
            platform: macos
            arch: x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          clean: true
          ref: ${{ needs.verify-ci.outputs.sha }}
      
      - name: Clean build artifacts (self-hosted runners)
        run: |
          rm -rf build/ dist/ paydirt-web/backend/web_static/
        shell: bash
       
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'
      
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      
      - name: Build frontend
        if: matrix.os != 'windows-latest'
        run: |
          cd paydirt-web/frontend
          npm install --legacy-peer-deps
          npm run build
          cd ../backend
          rm -rf web_static && cp -r ../frontend/dist web_static

      - name: Build frontend (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd paydirt-web/frontend
          npm install --legacy-peer-deps
          npm run build
          cd ../backend
          Remove-Item -Recurse -Force web_static -ErrorAction SilentlyContinue
          Copy-Item -Recurse ../frontend/dist web_static
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools==69.5.1 pyinstaller typing_extensions -r paydirt-web/backend/requirements.txt
          python -m pip check
          python -m pip freeze > build-requirements.txt

      - name: Preserve resolved build dependencies
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dependencies-${{ matrix.artifact }}
          path: build-requirements.txt
          if-no-files-found: error
       
      - name: Build executable
        run: |
          pyinstaller paydirt.spec --clean
          echo "Build output:"
          python -c "import os; print('Files in dist:', os.listdir('dist'))"
          echo "Build complete"
      
      - name: Install NSIS
        if: matrix.os == 'windows-latest'
        run: |
          choco install nsis -y
        shell: pwsh
      
      - name: Create Windows installer
        if: matrix.os == 'windows-latest'
        run: |
          & 'C:\Program Files (x86)\NSIS\makensis.exe' packaging/windows/installer.nsi
      
      - name: Create macOS DMG
        if: matrix.os == 'macos-latest' || matrix.os == 'macos-26-intel'
        run: |
          brew install create-dmg
          env GITHUB_REF_NAME="$RELEASE_TAG" ./packaging/macos/create_app.sh
      
      - name: Create Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick squashfs-tools
          env GITHUB_REF_NAME="$RELEASE_TAG" ./packaging/linux/create_appimage.sh
      
      - name: Upload warning file
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: warnings-${{ matrix.artifact }}
          path: build/*/warn-*.txt
          if-no-files-found: ignore

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: paydirt-linux
          path: dist/Paydirt-x86_64.AppImage
          if-no-files-found: error

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: paydirt-windows
          path: |
            dist/paydirt.exe
            dist/PaydirtSetup.exe
          if-no-files-found: error

      - name: Upload macOS ARM64 artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: paydirt-macos-arm64
          path: dist/Paydirt-*-arm64.dmg
          if-no-files-found: error

      - name: Upload macOS Intel artifact
        if: matrix.os == 'macos-26-intel'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: paydirt-macos-intel
          path: dist/Paydirt-*-x86_64.dmg
          if-no-files-found: error

  release:
    needs: [verify-ci, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
      
      - name: Verify all five mandatory release packages
        env:
          RELEASE_TAG: ${{ needs.verify-ci.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          required = [
              Path("artifacts/paydirt-linux/Paydirt-x86_64.AppImage"),
              Path("artifacts/paydirt-windows/paydirt.exe"),
              Path("artifacts/paydirt-windows/PaydirtSetup.exe"),
              Path(f"artifacts/paydirt-macos-arm64/Paydirt-{version}-arm64.dmg"),
              Path(f"artifacts/paydirt-macos-intel/Paydirt-{version}-x86_64.dmg"),
          ]
          for package in required:
              if package.is_symlink() or not package.is_file() or package.stat().st_size == 0:
                  raise SystemExit(f"Missing or invalid mandatory release package: {package}")
          for package in required[-2:]:
              if set(package.parent.glob("*.dmg")) != {package}:
                  raise SystemExit(f"Unexpected release package inventory: {package.parent}")
          print("Verified all five mandatory nonempty release packages")
          PY

      # An explicit older target_commitish triggers GitHub's workflow-write
      # restriction even for an existing tag. Verify the tag, then let the API
      # use its default target metadata; the existing tag still selects source.
      - name: Recheck existing immutable tag before publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
          RELEASE_TAG: ${{ needs.verify-ci.outputs.tag }}
          EXPECTED_SHA: ${{ needs.verify-ci.outputs.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          base = os.environ["GH_API_URL"] + "/repos/" + os.environ["GH_REPO"]
          def get(path):
              request = urllib.request.Request(base + path, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          obj = get("/git/ref/tags/" + urllib.parse.quote(os.environ["RELEASE_TAG"], safe=""))["object"]
          for _ in range(10):
              if obj["type"] != "tag":
                  break
              obj = get("/git/tags/" + obj["sha"])["object"]
          if obj["type"] != "commit" or obj["sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("Existing tag no longer matches the tested build commit")
          print("Existing release tag matches tested build", obj["sha"])
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.verify-ci.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/paydirt-linux/Paydirt-x86_64.AppImage
            artifacts/paydirt-windows/paydirt.exe
            artifacts/paydirt-windows/PaydirtSetup.exe
            artifacts/paydirt-macos-arm64/*.dmg
            artifacts/paydirt-macos-intel/*.dmg
          draft: false
          prerelease: ${{ contains(needs.verify-ci.outputs.tag, '-') }}
          body: |
            ## Play in your browser
            [Open Paydirt](https://rtulloh.github.io/paydirt/) to play without installing a desktop application.
            Games and seasons stay in the same browser profile and site. Export backups before clearing site data or changing devices. Browser play needs internet access to load Python and its packages; saving does not guarantee offline loading.

            Create persistent seasons, customize mixed-era leagues, and follow standings and team statistics. Individual player statistics are not tracked. Historical accuracy limitations, approximate season tiebreaks and unknown counters in older saves remain documented in the guides.

            ## Optional desktop downloads
            - **macOS Apple Silicon:** the `arm64.dmg` asset
            - **macOS Intel:** the `x86_64.dmg` asset
            - **Windows installer:** `PaydirtSetup.exe`
            - **Windows portable:** `paydirt.exe`
            - **Linux x86-64:** `Paydirt-x86_64.AppImage`

            Desktop applications keep their library in local application data. Export remains the portable backup route.
            macOS bundles are ad-hoc signed, not notarized; operating-system security may block a first launch. Functional package checks do not establish signing trust or clean browser-quarantine approval. See the installation guide for verification limits.
          token: ${{ secrets.GITHUB_TOKEN }}
  verify-published-install:
    needs: [verify-ci, release]
    uses: ./.github/workflows/post-release-smoke.yml
    permissions:
      contents: read
    with:
      release_tag: ${{ needs.verify-ci.outputs.tag }}
      include_1977: true
