name: Urgent packaged application qualification

# Manual only: use for an explicitly authorized urgent repair, not routine releases.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install focused acceptance dependencies
        run: python -m pip install pytest pyyaml fastapi httpx uvicorn
      - name: Verify release selection and immutable-tag controls
        run: python -m pytest tests/test_release_workflow_gate.py tests/test_release_metadata.py tests/test_release_chart_packaging.py tests/test_documentation.py -q -o addopts= --tb=short
      - name: Verify actual frozen-layout launcher and API confinement
        working-directory: paydirt-web/backend
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_frozen_launcher.py tests/test_path_confinement.py -q -o addopts= --tb=short
