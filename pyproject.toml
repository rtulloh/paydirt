[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paydirt"
version = "1.10.5"
description = "A Python simulation of the classic Paydirt football board game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml"]
license = {text = "MIT"}
authors = [
    {name = "Paydirt Fan", email = "fan@example.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
]

[project.scripts]
paydirt = "paydirt.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:uvicorn.*",
]

[tool.ruff]
line-length = 100
# Pydantic evaluates API annotations at runtime, including in local Python 3.9 checks.
per-file-target-version = {"paydirt-web/backend/routes.py" = "py39", "paydirt-web/backend/chart_viewer.py" = "py39"}

[tool.ruff.lint]
ignore = ["E402", "F401"]

[tool.ruff.lint.per-file-ignores]
# Reviewed released-baseline file: the released-chart and 1977 gates require
# byte-identical runtime sources, so this E731 cannot be rewritten without a
# separately qualified gameplay change. See docs/dev-notes/issues/LINT/LINT-001.md.
"paydirt/game_engine.py" = ["E731"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.coverage.run]
source = ["paydirt"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
